name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on the example export
        run: |
          gcp-idle-resources --dir examples/acme-prod --now 2025-11-10T00:00:00Z
          gcp-idle-resources --dir examples/acme-prod --now 2025-11-10T00:00:00Z --format json > /dev/null
          gcp-idle-resources --dir examples/acme-prod --now 2025-11-10T00:00:00Z --format commands
